name: generate-snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: haseebniazii
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=#2d3343,#0f766e,#0891b2,#22d3ee,#a78bfa
            dist/snake-light.svg?palette=github-light&color_snake=%237C3AED&color_dots=#e5e7eb,#c7f9ec,#67e8f9,#22d3ee,#7c3aed

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
