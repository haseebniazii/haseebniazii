🌑 dark.svg
<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">

<!-- Background -->
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030712"/>
    <stop offset="100%" stop-color="#020617"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7C3AED">
      <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1180" height="610" rx="20" fill="url(#bgGrad)"/>

<!-- Floating particles -->
<circle cx="200" cy="100" r="2" fill="#22D3EE">
  <animateTransform attributeName="transform" type="translate" values="0,0; 20,40; 0,0" dur="6s" repeatCount="indefinite"/>
</circle>

<!-- LEFT ASCII AREA -->
<g transform="translate(60,100)">
  <text font-family="monospace" font-size="12" fill="url(#accent)" filter="url(#glow)">
    <tspan x="0" dy="1.2em">   ███╗   ██╗ █████╗ ███╗   ███╗</tspan>
    <tspan x="0" dy="1.2em">   ████╗  ██║██╔══██╗████╗ ████║</tspan>
    <tspan x="0" dy="1.2em">   ██╔██╗ ██║███████║██╔████╔██║</tspan>
    <tspan x="0" dy="1.2em">   ██║╚██╗██║██╔══██║██║╚██╔╝██║</tspan>
    <tspan x="0" dy="1.2em">   ██║ ╚████║██║  ██║██║ ╚═╝ ██║</tspan>
    <animate attributeName="opacity" values="0;1" dur="3s" fill="freeze"/>
  </text>

  <!-- Cursor -->
  <rect x="280" y="120" width="8" height="14" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
