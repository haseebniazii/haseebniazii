Agar aap ne sirf 1 project upload kiya hai aur phir bhi 5 contributions dikh rahi hain, to iska matlab hai GitHub ne us ek project ke andar hui multiple activities count ki hain.

Misal ke taur par:

✅ Repository banayi → 1 contribution (agar default branch par count hui)

✅ Files upload ki → commits bane (har commit contribution ho sakta hai)

✅ README.md add/update ki → ek aur commit

✅ Code files add ki → aur commits

Aap check kar sakte ho:

GitHub par apni Profile open karo

Contributions graph mein kisi green square par click karo

Wahan likha hoga ke kis din kya activity hui:

"Created repository"

"Pushed commits"

"Updated files"

Agar aap ne ek hi baar upload kiya tha, to ho sakta hai upload ke time GitHub ne multiple commits count kiye hon.

Agar aap chahte ho ke contributions zyada aur professional lagen, to project par regularly kaam karke chhote meaningful commits karo, jaise:

"Added data cleaning"

"Updated model training"

"Improved README"

"Fixed bugs"


